cat /sys/kernel/audio-smartpa-6-37/reg
cat /sys/class/sound/card0/mtk_codec_attrs/mtk_audio_codec
cat /sys/class/sound/card0/mtk_afe_attrs/mtk_afe_node
cat /sys/kernel/audio-max20328/reg
speaker_headphone cmd end

input_buildin_mic cmd start
cat /sys/class/sound/card0/mtk_codec_attrs/mtk_audio_codec
cat /sys/class/sound/card0/mtk_afe_attrs/mtk_afe_node
