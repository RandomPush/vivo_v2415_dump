# FACTORY MIMO TEST

AtpsEnable 0
Enable1RPD 0
SGCfg 0x0

# 68(DEC) == 44(HEX)
ScreenoffDTIMPeriod 68
# ALPS09066054 Ultra Save Receiver: align with ScreenoffDTIMPeriod
LittleScreenOffDtimPeriod 4
ScreenOnBeaconTimeoutCount 20
BcnTimeoutCountP2P 20
BcnTimeoutCountBT 20
ScreenOffBeaconTimeoutCount 3
RoamingCustomization 1
RoamingEnableScreenoff 1
MovingAverage 2
RoamingRcpiHi 84
RoamingRCPIGoodValue 70
AgingPeriod 25

# IOT AP begin

# HuaWei AP, such as H122-373, HW-TC7102, WS5200
IOTAP0 0:00E0FC::::::::6

# leike AP, HN140, ws831, ws851
IOTAP1 0:00E04C::::::::6

# FAST AP, GPON GM619
IOTAP2 0:000C43::::::::6

# TL-WR2041N OUI: 00:03:7f Atheros Communication
IOTAP3 0:00037f::::::::3

# Tx failure on Tenda AX12 AP(Metalink LTD. vendor IE) due to aggressive EDCA parameters
IOTAP4 0:000986::::::::6

# COEX: 841N AP with OUI=000AEB, MAC[0:2]=206BE7
IOTAP5 0:000AEB:::206BE7000000:ffffff000000::::3

# 845N AP with OUI=000AEB, MAC[0:2]=50FA84
IOTAP6 0:000AEB:::50FA84000000:ffffff000000::::3

# feixun k2 AP with OUI=000C43, MAC[0:2]=2CB21A or MAC[0:2]=747D24 or MAC[0:2]=CC81DA
IOTAP7 0:000C43:::2CB21A000000:ffffff000000::::3
IOTAP8 0:000C43:::747D24000000:ffffff000000::::3
IOTAP9 0:000C43:::CC81DA000000:ffffff000000::::3

# ASUS AX11000
IOTAP10 0:001018:::049226000000:ffffff000000::::6

# WLAN_IOT_AP_OWE_PMK_REMOVE: TL-XTR10890
IOTAP11 0:000AEB:::687724000000:ffffff000000::::D

# DL_DIR878_2.4g, MERCURY-4FEF_2.4G
IOTAP12 0:000CE7:::0CB6D2000000:ffffff000000::::3
IOTAP13 0:508965:::24698E000000:ffffff000000::::3

# disable tx amsdu: ASUS_30_5G, B-LINK-5G_D183C2, M2_5G
IOTAP14 0:000CE7:00000000:ffffffff:::2:2::12

# IOT AP end

# EDCA parameter
# Fast Tx mode
WmmParamCfgEn 1
WmmParamCwMax 3
WmmParamCwMin 2
WmmParamAifsN 2
WmmParamTxOp 400
WmmTxopExtension 1

WmmBkParamCfgEn 1
WmmBkParamTxOp 400
WmmBkParamCwMax 3
WmmBkParamCwMin 2
WmmBkParamAifsN 2

# IOT AP BK BKUP
WmmApIotBkParamCfgEn 1
WmmApIotBkParamTxOp 160
WmmApIotBkParamCwMax 5
WmmApIotBkParamCwMin 4
WmmApIotBkParamAifsN 3

# IOT AP BE BKUP
WmmApIotBeParamCfgEn 1
WmmApIotBeParamTxOp 160
WmmApIotBeParamCwMax 5
WmmApIotBeParamCwMin 4
WmmApIotBeParamAifsN 3

# enable AutoHwDebug
SetChip0 AutoHwDebug set en 1

# disable smartgear
SGCfg 0x0
# enable smartgear & default 1T2R
#SmartGear1T1R 0

# ATPS config
# AtpsEnable 0:disable; 1:enabled(default)
# AtpsStaMode/AtpsSapMode/AtpsP2pMode 0:disable; 1:Highest rate; 2:All rate(default)
#AtpsEnable 1
#AtpsStaMode 1
#AtpsSapMode 1
#AtpsP2pMode 1

# Auto TX Power Extension Mode
AtpemEnable 0
AtpemRcpiLimit 80

# enable WBH2.0
CoexFddSupport 1

# ITO count; default 2
#PmTxUcPktNumThr 1
#PmRxUcPktNumThr 1
#PkatExtendThresholdTxCount 1
#PkatExtendThresholdRxCount 1

# PER ROAM 0:disable; 1:enabled(default)
RoamingTXErrorEnable 0

# disable APs
ApsEnable 0

# ALPS08472866 beacon collect
BcnDynamicSupport 1
BcnDynamicDbdcSupport 1
BcnDynamicAggressive 1
BcnDynamicTrainingCount 15
BcnDynamicDriftMaxValue 10

# ALPS07895575 non-connected state, DFS channel passive scan dwell time
ScnChannelDFSTime 110

#lls update limit
LinkStatsCmdPeriod 100

# ALPS07887799
PkatChannelBusyExtendTimeMs 200

# enable hotspot channel switch
# Set MD Lte b40 vs wifi 2.4G ch1~5 unsafe
coex00 coexSetIdcACSBmp 0 0 0 40 1 5

# Set MD Lte b41 vs wifi 2.4G ch7~13 unsafe
coex01 coexSetIdcACSBmp 0 0 1 41 7 13

#Set MD Nr n40 vs wifi 2.4G ch1~5 unsafe
coex02 coexSetIdcACSBmp 1 0 0 40 1 5

#Set MD Nr n41 vs wifi 2.4G ch7~13 unsafe
coex03 coexSetIdcACSBmp 1 0 1 41 7 13

# disable mixed mode & dynamic TDD
coexTddMixedMode 3
DynamicTddSupport 0

# AMSDU config
TxHtMaxAmsduNum 1
TxVhtMaxAmsduNum 2

# ALPS08309021
DynamicIcsEn 1

# Low Traffic RA ALPS08115007
LowTrafficBwAdjust 1

# MLR cfg
MlrCfg 1

# WiFi7 Feature cfg
# enable EHT
StaEHT 1
ApEHT 0
P2pGoEHT 0
P2pGcEHT 0
EnableMlo 1

# ALPS08342990 fix max BA rate 24M
# 1: enable, 0: disable
TxRspRateLimit 1

# ALPS08521640
DynElnaCorxEn 0

# ALPS08944746 disable RF Doze Mode
RfDozeModeEn 0

# ALPS09048528 disable ALPL
EnableALPL 0

# ALPS08801916 IC
coex CoTunerEn 1

# ALPS09037947
PcieCustomizeGen 3

# ALPS09108145 disable DTIM1R
EnableDtim1RConfig 0

# ALPS09144325
RtsRtyModeByBssEn 0

# ALPS09175323
VoltInfoEnable 0

# ALPS09169250
EnablePartialBeacon 0
